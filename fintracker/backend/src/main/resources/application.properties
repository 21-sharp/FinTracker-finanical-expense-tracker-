# ============================================================
# FinTrack Pro - Application Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/api

# Application
spring.application.name=FinTrack Pro

# ============================================================
# MySQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/fintrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=FinTrackProSecretKey2024!@#$%^&*()VeryLongSecretKeyForSecurity
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ============================================================
# Mail (SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ramaswamy9397@gmail.com
spring.mail.password=daslbnznjjkpyggt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# OTP: falls back to console/UI if email send fails
app.otp.dev-mode=true
app.otp.expose-in-response=true

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:4200

# ============================================================
# Logging
# ============================================================
logging.level.com.fintrack=DEBUG
logging.level.org.springframework.security=INFO

# SQL Init Mode
spring.sql.init.mode=never
